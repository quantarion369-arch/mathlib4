name: Lean Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: leanprover/lean4-action@v1
      with:
        lean-toolchain: leanprover/lean4:nightly-2026-09-01
    - name: Build and verify
      run: lake build && lake exe verify
